server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. A variable proxy_pass resolves the backend when the
    # request arrives, so nginx still serves the UI if the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy - all methods (GET, POST, PUT, DELETE, OPTIONS)
    location /api/ {
        set $api_upstream backend:8443;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket proxy
    location /ws {
        set $ws_upstream backend:8443;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
