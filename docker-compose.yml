services:
  # ============ PostgreSQL with pgvector ============
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mirage-db
    environment:
      POSTGRES_USER: mirage
      POSTGRES_PASSWORD: mirage
      POSTGRES_DB: miragedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirage -d miragedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mirage-net

  # ============ Backend API ============
  backend:
    build:
      context: .
      dockerfile: build/backend/Dockerfile
    container_name: mirage-backend
    ports:
      - "8443:8443"
    environment:
      DATABASE_URL: postgres://mirage:mirage@postgres:5432/miragedb?sslmode=disable
      DOCKER_HOST: unix:///var/run/docker.sock
      # Scanners run in the full tool image. The firewall helper is a separate
      # minimal image and is never used as the scan sandbox.
      SANDBOX_IMAGE: mirage-tools:latest
      FIREWALL_HELPER_IMAGE: mirage-firewall:local
      MIRAGE_EXECUTION_V2: ${MIRAGE_EXECUTION_V2:-true}
      # Optional private-lab override. Loopback stays refused.
      MIRAGE_TARGET_ALLOWLIST: ${MIRAGE_TARGET_ALLOWLIST:-}
      # The API writes here. The host path Docker can bind is discovered from
      # this container's own /workspaces mount, so a Windows ${PWD} is not
      # passed back through the socket.
      MIRAGE_WORKSPACE_ROOT: /workspaces
      CODEX_HOME: /root/.codex
      # gpt-5.3-codex is retired for Codex ChatGPT sign-in. Prefer gpt-6.1-sol
      # or set MIRAGE_LLM_PROVIDER=api_key with OPENAI_API_KEY and gpt-4o.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      MIRAGE_LLM_PROVIDER: ${MIRAGE_LLM_PROVIDER:-auto}
      # Empty fallback lets Mirage use ~/.codex/config.toml when remapping.
      MIRAGE_LLM_FALLBACK_MODEL: ${MIRAGE_LLM_FALLBACK_MODEL:-}
      # Optional API key fallback (not needed if using codex login)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Decision-1 specialist routing. Leave empty to keep deterministic rules.
      # The generative model above still writes plans, tool calls, and reports.
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_DEPLOYMENT: ${FOUNDRY_DEPLOYMENT:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_TIMEOUT_SECONDS: ${FOUNDRY_TIMEOUT_SECONDS:-15}
      FOUNDRY_MIN_CONFIDENCE: ${FOUNDRY_MIN_CONFIDENCE:-0.55}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:-${USERPROFILE}}/.codex:/root/.codex:ro
      - ./logs:/app/logs
      - ./data/workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      firewall-helper:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mirage-net

  # ============ Frontend ============
  # The API process only serves frontend/dist when that directory exists.
  # This container is the deployment path for the React UI.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mirage-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mirage-net

  # ============ Firewall helper image ============
  # Exits after creation. Its image is what the API uses to run iptables
  # on the Docker host. It is not the scanner sandbox.
  firewall-helper:
    image: mirage-firewall:local
    build:
      context: ./build/egress-fixture
    command: ["true"]
    restart: "no"
    networks:
      - mirage-net

  # ============ Persistent Sandbox ============
  # Full scanner image (nmap, nuclei, sqlmap, ffuf, curl). Flow containers
  # are created from SANDBOX_IMAGE. This service keeps that image present.
  sandbox:
    image: mirage-tools:latest
    build:
      context: ./build/tools
      dockerfile: Dockerfile
    container_name: mirage-sandbox
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      firewall-helper:
        condition: service_completed_successfully
    networks:
      - mirage-net

  # ============ Neo4j Knowledge Graph (Phase 2) ============
  neo4j:
    image: neo4j:5-community
    container_name: mirage-neo4j
    environment:
      NEO4J_AUTH: neo4j/miragepass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    networks:
      - mirage-net
    profiles:
      - full

volumes:
  pgdata:
  neo4j_data:

networks:
  mirage-net:
    driver: bridge
